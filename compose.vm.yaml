# Production-like settings for the single Azure VM.
# Keep the base docker-compose.yml suitable for local development.
services:
  postgres:
    ports: !reset []

  redis:
    ports: !reset []

  backend:
    ports: !override
      - "127.0.0.1:8080:8000"

  frontend:
    ports: !override
      - "127.0.0.1:3000:3000"
    environment:
      NODE_ENV: production
    command:
      - sh
      - -c
      - npm run build && npm run start -- --hostname 0.0.0.0
