global:
  scrape_interval: 15s
  evaluation_interval: 15s
rule_files:
  - /etc/prometheus/alerts.yml
scrape_configs:
  - job_name: api
    static_configs:
      - targets: ['backend:9101']
  - job_name: tracker
    static_configs:
      - targets: ['tracker:9101']
  - job_name: worker
    static_configs:
      - targets: ['segment-worker:9101']
  - job_name: node
    static_configs:
      - targets: ['node-exporter:9100']
  - job_name: cadvisor
    static_configs:
      - targets: ['cadvisor:8080']
  - job_name: redis
    static_configs:
      - targets: ['redis-exporter:9121']
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']
