services:
  postgres:
    image: postgis/postgis:15-3.3
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DATABASE_NAME}
      POSTGRES_USER: ${DATABASE_USER}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
    env_file:
      - ./backend/.env
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  backend:
    build: ./backend
    restart: unless-stopped
    ports:
      - "8080:8000"
    volumes:
      - ./backend/yolo:/app/yolo
      - ./backend/data:/app/data
    env_file: ./backend/.env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  beat:
    build: ./backend
    restart: unless-stopped
    command: celery -A app.workers.celery_app beat --loglevel=info
    env_file: ./backend/.env
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy

  tracker:
    build:
      context: ./backend
      dockerfile: Dockerfile.worker
    restart: unless-stopped
    command: python -m app.workers.tracking_worker
    env_file: ./backend/.env
    volumes:
      - ./backend/yolo:/app/yolo
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy

  segment-worker:
    build: ./backend
    restart: unless-stopped
    command: celery -A app.workers.celery_app worker -Q inference --loglevel=info --concurrency=1
    env_file: ./backend/.env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - ./frontend/.env
    environment:
      - NODE_ENV=development

volumes:
  pgdata:
