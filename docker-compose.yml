services:
  postgres:
    image: postgis/postgis:15-3.3
    environment:
      POSTGRES_DB: ecotraffic
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    env_file: .env
    depends_on:
      - postgres
      - redis

  worker:
    build: ./backend
    command: celery -A app.workers.inference_worker worker --loglevel=info
    env_file: .env
    depends_on:
      - redis
      - postgres

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"

volumes:
  pgdata: